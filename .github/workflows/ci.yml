name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy --strict src
      - name: Check consumed wire types
        run: python scripts/generate_wire.py --check
      - name: Check breaking schema changes
        if: matrix.python-version == '3.12'
        run: python scripts/check_wire_drift.py
      - name: Test
        run: pytest -q --cov=shieldlabs --cov-report=term-missing

  example:
    name: FastAPI example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" -r examples/requirements.txt
      - name: Smoke test
        run: pytest -q tests/test_example_app.py

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m venv /tmp/wheel-consumer
          /tmp/wheel-consumer/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-consumer/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  generated:
    name: Generated API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Rebuild generated files
        run: |
          python3 -m pip install -e ".[dev]"
          ./generate.sh
      - name: Fail if generated files drifted
        run: git diff --exit-code
