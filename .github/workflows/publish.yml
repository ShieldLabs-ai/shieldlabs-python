name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      # Configure trusted publisher on PyPI for project "shieldlabs"
      # (owner ShieldLabs-ai, repo shieldlabs-python, workflow publish.yml).
      - uses: pypa/gh-action-pypi-publish@release/v1
